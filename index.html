<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณค่าคอมมิชชันแบบละเอียด</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md my-4">
        <h1 class="text-2xl font-bold text-center text-orange-600 mb-6">📊 คำนวณค่าคอมแบบแจกแจงละเอียด</h1>
        
        <!-- เลือกประเภทงาน -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">ประเภทพนักงาน / โซน</label>
            <select id="empType" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500" onchange="toggleSizeSelect()">
                <option value="z9_pickup">โซน Z9 : พนักงานรถกระบะ</option>
                <option value="z9_own_fleet">โซน Z9 : พนักงานรถกระบะ Own-fleet</option>
                <option value="z9_motorcycle">โซน Z9 : พนักงานมอเตอร์ไซค์</option>
                <option value="z6_shipper">โซน Z6 : พนักงาน 2WL Shipper</option>
            </select>
        </div>

        <!-- เลือกไซส์พัสดุ -->
        <div class="mb-4" id="sizeContainer">
            <label class="block text-gray-700 text-sm font-bold mb-2">ขนาดพัสดุ</label>
            <select id="packageSize" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500">
                <option value="S">พัสดุขนาดเล็ก (SIZE S)</option>
                <option value="L">พัสดุขนาดทั่วไป (SIZE L)</option>
            </select>
        </div>

        <!-- กรอกจำนวนชิ้น -->
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">จำนวนพัสดุที่ส่งสำเร็จ (ต่อวัน)</label>
            <input type="number" id="parcels" min="0" placeholder="ระบุจำนวนชิ้น เช่น 120" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <!-- ปุ่มคำนวณ -->
        <button onclick="calculateCommission()" class="w-full bg-orange-500 text-white font-bold p-3 rounded-xl hover:bg-orange-600 transition shadow-md">
            คำนวณและแสดงวิธีคิด
        </button>

        <!-- แสดงผลลัพธ์และวิธีคิด -->
        <div class="mt-6 hidden" id="resultContainer">
            <div class="p-4 bg-orange-50 rounded-xl border border-orange-200 text-center mb-4">
                <p class="text-gray-600 text-sm font-medium">💰 รวมเงินที่จะได้รับทั้งหมด</p>
                <p class="text-3xl font-extrabold text-orange-600 mt-1"><span id="totalEarnings">0</span> บาท</p>
            </div>
            
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                <h3 class="font-bold text-gray-700 text-sm mb-2">📄 รายละเอียดและวิธีคิดเงิน</h3>
                <div id="breakdownList" class="space-y-2 text-sm text-gray-600">
                    <!-- วิธีคิดทีละข้อจะโผล่ตรงนี้ -->
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSizeSelect() {
            const empType = document.getElementById('empType').value;
            const sizeContainer = document.getElementById('sizeContainer');
            if (empType === 'z9_motorcycle') {
                sizeContainer.classList.add('hidden');
            } else {
                sizeContainer.classList.remove('hidden');
            }
        }

        function calculateCommission() {
            const empType = document.getElementById('empType').value;
            const size = document.getElementById('packageSize').value;
            const parcels = parseInt(document.getElementById('parcels').value) || 0;
            
            let rates = [];

            // กำหนดโครงสร้างเรทราคา [เริ่มต้นชิ้นที่, สิ้นสุดชิ้นที่, ราคาต่อชิ้น] ตามหน้าตารางภาพที่ 1
            if (empType === 'z9_pickup') {
                rates = size === 'L' 
                    ? [[0, 44, 0], [44, 99, 12], [99, 169, 13], [169, 209, 10.5], [209, Infinity, 9.5]]
                    : [[0, 44, 0], [44, 99, 7], [99, 169, 8], [169, 209, 6.5], [209, Infinity, 5.5]];
            } else if (empType === 'z9_own_fleet') {
                rates = size === 'L'
                    ? [[0, 44, 0], [44, 69, 7], [69, 114, 8], [114, Infinity, 9]]
                    : [[0, 44, 0], [44, 69, 4], [69, 114, 5], [114, Infinity, 5]];
            } else if (empType === 'z9_motorcycle') {
                rates = [[0, 69, 0], [69, 89, 6], [89, 179, 7], [179, 209, 8], [209, 249, 6.5], [249, Infinity, 5.5]];
            } else if (empType === 'z6_shipper') {
                rates = size === 'L'
                    ? [[0, 34, 0], [34, 74, 10], [74, 114, 12], [114, Infinity, 13]]
                    : [[0, 34, 0], [34, 74, 6], [74, 114, 7], [114, Infinity, 8]];
            }

            let total = 0;
            let breakdownHtml = '<p class="font-semibold text-gray-700">1. แยกพัสดุออกเป็นแต่ละขั้นตามลำดับ:</p><ul class="list-disc pl-5 space-y-1">';
            let calculationHtml = '<p class="font-semibold text-gray-700 mt-3">2. คำนวณเงินของแต่ละขั้นแล้วนำมารวมกัน:</p><ul class="list-disc pl-5 space-y-1">';

            for (let i = 0; i < rates.length; i++) {
                let start = rates[i][0];
                let end = rates[i][1];
                let rate = rates[i][2];

                if (parcels > start) {
                    // หาจำนวนชิ้นที่ตกอยู่ในช่วงเทียร์นี้
                    let currentTierParcels = Math.min(parcels, end) - start;
                    let tierCost = currentTierParcels * rate;
                    total += tierCost;

                    // แสดงชื่อช่วงเช่น "ชิ้นที่ 0 - 44" หรือ "ชิ้นที่ 210 เป็นต้นไป"
                    let rangeText = end === Infinity ? `ชิ้นที่ ${start + 1} เป็นต้นไป` : `ชิ้นที่ ${start === 0 ? 0 : start + 1} - ${end}`;
                    
                    breakdownHtml += `<li>ขั้นที่ ${i + 1} (${rangeText}): มีโควตาอยู่ในช่วงนี้ <span class="text-orange-600 font-medium">${currentTierParcels} ชิ้น</span> (${rate} บาท/ชิ้น)</li>`;
                    calculationHtml += `<li>ขั้นที่ ${i + 1}: ${currentTierParcels} ชิ้น × ${rate} บาท = <span class="font-medium text-gray-800">${tierCost.toLocaleString('th-TH')} บาท</span></li>`;
                } else {
                    break;
                }
            }

            breakdownHtml += `</ul><p class="text-xs text-gray-500 mt-1">(รวมจำนวนพัสดุทุกขั้น: ${parcels} ชิ้น ครบพอดี)</p>`;
            calculationHtml += `</ul>`;

            // อัปเดตข้อมูลขึ้นบนหน้าจอเว็บ
            document.getElementById('totalEarnings').innerText = total.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('breakdownList').innerHTML = breakdownHtml + calculationHtml;
            document.getElementById('resultContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
