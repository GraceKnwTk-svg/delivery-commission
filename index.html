<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณค่าคอมมิชชัน SPX ขนส่ง</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-lg my-4">
        <h1 class="text-2xl font-bold text-center text-orange-600 mb-6">📊 โปรแกรมคำนวณค่ากล่องรายวัน SPX</h1>
        
        <!-- 1. เลือกประเภทงาน -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">ประเภทพนักงาน / โซน</label>
            <select id="empType" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500" onchange="toggleInputs()">
                <option value="z9_pickup">โซน Z9 : พนักงานรถกระบะ (4W)</option>
                <option value="z9_own_fleet">โซน Z9 : พนักงานรถกระบะ Own-fleet (4W)</option>
                <option value="z9_motorcycle">โซน Z9 : พนักงานมอเตอร์ไซค์ (2W)</option>
                <option value="z6_shipper">โซน Z6 : พนักงาน 2WL Shipper (2W)</option>
            </select>
        </div>

        <!-- 2. กรอกจำนวนพัสดุแยกไซส์ -->
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">จำนวนพัสดุเล็ก (Size S)</label>
                <input type="number" id="sizeSCount" min="0" value="0" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            <div id="sizeLContainer">
                <label class="block text-gray-700 text-sm font-bold mb-2">จำนวนพัสดุทั่วไป (Size L)</label>
                <input type="number" id="sizeLCount" min="0" value="0" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
        </div>

        <!-- 3. กรอกจำนวนพัสดุหักลบงานซ้ำ Same Address -->
        <div class="mb-6 p-4 bg-red-50 rounded-xl border border-red-100">
            <h3 class="font-bold text-red-700 text-sm mb-2">🏠 กรณีส่งพัสดุหลายชิ้นในที่อยู่เดียวกัน (Same Address)</h3>
            <p class="text-xs text-red-500 mb-3">* หักชิ้นที่ 2 เป็นต้นไป เช่น บ้านเดียวกันส่ง 3 ชิ้น ให้กรอกจำนวนหักลบ = 2 ชิ้น</p>
            <div>
                <label class="block text-gray-600 text-xs font-bold mb-1">รวมจำนวนชิ้นที่จะโดนหักลบ (ทุกบ้านรวมกัน)</label>
                <input type="number" id="sameAddressDeduct" min="0" value="0" placeholder="กรอกจำนวนชิ้นรวมที่จะโดนหัก เช่น 26" class="w-full p-3 border rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-red-400">
            </div>
        </div>

        <!-- ปุ่มคำนวณ -->
        <button onclick="processCalculation()" class="w-full bg-orange-500 text-white font-bold p-3 rounded-xl hover:bg-orange-600 transition shadow-md">
            คำนวณและแจกแจงวิธีคิด
        </button>

        <!-- 4. ส่วนแสดงผลลัพธ์และวิธีคิดเงิน -->
        <div class="mt-6 hidden" id="resultContainer">
            <div class="grid grid-cols-3 gap-2 text-center text-xs mb-4">
                <div class="p-3 bg-blue-50 rounded-xl border border-blue-200">
                    <p class="text-gray-500 font-medium">ค่ากล่องสะสม (A)</p>
                    <p class="text-lg font-bold text-blue-600 mt-1"><span id="grossIncome">0</span> บ.</p>
                </div>
                <div class="p-3 bg-red-50 rounded-xl border border-red-200">
                    <p class="text-gray-500 font-medium">หักงานซ้ำ (B)</p>
                    <p class="text-lg font-bold text-red-600 mt-1"><span id="deductAmount">0</span> บ.</p>
                </div>
                <div class="p-3 bg-green-50 rounded-xl border border-green-200">
                    <p class="text-gray-500 font-medium">สุทธิที่ได้รับ (A-B)</p>
                    <p class="text-xl font-extrabold text-green-600 mt-1"><span id="netIncome">0</span> บ.</p>
                </div>
            </div>
            
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                <h3 class="font-bold text-gray-700 text-sm mb-3">📄 ตารางแจกแจงการนับพัสดุตามลำดับ (เริ่มจาก Size S ก่อน)</h3>
                <div id="breakdownList" class="space-y-4 text-xs text-gray-600 overflow-x-auto">
                    <!-- รายละเอียดแบบตารางจะโผล่ตรงนี้ -->
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleInputs() {
            const empType = document.getElementById('empType').value;
            const sizeLContainer = document.getElementById('sizeLContainer');
            // มอเตอร์ไซค์ไม่มีแยก Size L ให้ซ่อน
            if (empType === 'z9_motorcycle') {
                sizeLContainer.classList.add('hidden');
                document.getElementById('sizeLCount').value = 0;
            } else {
                sizeLContainer.classList.remove('hidden');
            }
        }

        function processCalculation() {
            const empType = document.getElementById('empType').value;
            const sCount = parseInt(document.getElementById('sizeSCount').value) || 0;
            const lCount = parseInt(document.getElementById('sizeLCount').value) || 0;
            const deductCount = parseInt(document.getElementById('sameAddressDeduct').value) || 0;
            const totalParcels = sCount + lCount;

            // กำหนดโครงสร้างเทียร์เรทราคาตามภาพที่ 1 [ชิ้นเริ่ม, ชิ้นสิ้นสุด, เรท L, เรท S, ประเภทรถ]
            let tiers = [];
            let vehicleType = '4W'; // เริ่มต้นเป็น 4W

            if (empType === 'z9_pickup') {
                vehicleType = '4W';
                tiers = [
                    { start: 0, end: 44, rateL: 0, rateS: 0 },
                    { start: 44, end: 99, rateL: 12, rateS: 7 },
                    { start: 99, end: 169, rateL: 13, rateS: 8 },
                    { start: 169, end: 209, rateL: 10.5, rateS: 6.5 },
                    { start: 209, end: Infinity, rateL: 9.5, rateS: 5.5 }
                ];
            } else if (empType === 'z9_own_fleet') {
                vehicleType = '4W';
                tiers = [
                    { start: 0, end: 44, rateL: 0, rateS: 0 },
                    { start: 44, end: 69, rateL: 7, rateS: 4 },
                    { start: 69, end: 114, rateL: 8, rateS: 5 },
                    { start: 114, end: Infinity, rateL: 9, rateS: 5 }
                ];
            } else if (empType === 'z9_motorcycle') {
                vehicleType = '2W';
                tiers = [
                    { start: 0, end: 69, rateL: 0, rateS: 0 },
                    { start: 69, end: 89, rateL: 6, rateS: 6 },
                    { start: 89, end: 179, rateL: 7, rateS: 7 },
                    { start: 179, end: 209, rateL: 8, rateS: 8 },
                    { start: 209, end: 249, rateL: 6.5, rateS: 6.5 },
                    { start: 249, end: Infinity, rateL: 5.5, rateS: 5.5 }
                ];
            } else if (empType === 'z6_shipper') {
                vehicleType = '2W';
                tiers = [
                    { start: 0, end: 34, rateL: 0, rateS: 0 },
                    { start: 34, end: 74, rateL: 10, rateS: 6 },
                    { start: 74, end: 114, rateL: 12, rateS: 7 },
                    { start: 114, end: Infinity, rateL: 13, rateS: 8 }
                ];
            }

            // คำนวณส่วนลด Same Address ตามเกณฑ์อัพเดทใหม่ล่าสุด ปี 2568 (รูปที่ 5)
            let deductRate = vehicleType === '4W' ? 2.5 : 1.5;
            let totalDeduction = deductCount * deductRate;

            // ตรรกะสำคัญ: สร้างคิวการจ่ายเงินโดยเรียงจากพัสดุชิ้นเล็ก (Size S) ขึ้นมานับก่อนพัสดุชิ้นใหญ่ (Size L)
            let remainingS = sCount;
            let remainingL = lCount;
            let grossTotal = 0;
            let globalIndex = 0;

            let tableRowsHtml = '';

            for (let i = 0; i < tiers.length; i++) {
                let tier = tiers[i];
                let tierCapacity = tier.end - tier.start;
                let processedInTier = 0;

                // 1. จัดพัสดุ Size S ลงในเทียร์นี้ก่อน
                if (remainingS > 0 && globalIndex < tier.end) {
                    let availableSpace = tier.end - globalIndex;
                    let sToProcess = Math.min(remainingS, availableSpace);
                    let money = sToProcess * tier.rateS;
                    grossTotal += money;
                    
                    let rangeText = `ชิ้นที่ ${globalIndex + 1} - ${globalIndex + sToProcess}`;
                    tableRowsHtml += `<tr class="border-b"><td class="p-2">${rangeText}</td><td class="p-2 text-center text-orange-600 font-medium">S</td><td class="p-2 text-center">${tier.rateS}</td><td class="p-2 text-center">${sToProcess}</td><td class="p-2 text-right font-bold">${money}</td></tr>`;
                    
                    remainingS -= sToProcess;
                    globalIndex += sToProcess;
                    processedInTier += sToProcess;
                }

                // 2. จัดพัสดุ Size L ลงในเทียร์เดิมที่เหลืออยู่
                if (remainingL > 0 && globalIndex < tier.end) {
                    let availableSpace = tier.end - globalIndex;
                    let lToProcess = Math.min(remainingL, availableSpace);
                    let money = lToProcess * tier.rateL;
                    grossTotal += money;

                    let rangeText = `ชิ้นที่ ${globalIndex + 1} - ${globalIndex + lToProcess}`;
                    tableRowsHtml += `<tr class="border-b"><td class="p-2">${rangeText}</td><td class="p-2 text-center text-blue-600 font-medium">L</td><td class="p-2 text-center">${tier.rateL}</td><td class="p-2 text-center">${lToProcess}</td><td class="p-2 text-right font-bold">${money}</td></tr>`;

                    remainingL -= lToProcess;
                    globalIndex += lToProcess;
