<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณค่าคอมมิชชันแบบละเอียด</title>
    <!-- เรียกใช้งาน Tailwind CSS เพื่อจัดหน้าต่างแอปให้สวยงามรองรับมือถือ -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md my-4">
        <h1 class="text-2xl font-bold text-center text-orange-600 mb-6">📊 คำนวณค่าคอมแบบแจกแจงละเอียด</h1>
        
        <!-- ส่วนที่ 1: เลือกประเภทงาน -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">ประเภทพนักงาน / โซน</label>
            <select id="empType" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500" onchange="toggleSizeSelect()">
                <option value="z9_pickup">โซน Z9 : พนักงานรถกระบะ</option>
                <option value="z9_own_fleet">โซน Z9 : พนักงานรถกระบะ Own-fleet</option>
                <option value="z9_motorcycle">โซน Z9 : พนักงานมอเตอร์ไซค์</option>
                <option value="z6_shipper">โซน Z6 : พนักงาน 2WL Shipper</option>
            </select>
        </div>

        <!-- ส่วนที่ 2: เลือกขนาดพัสดุ (จะซ่อนอัตโนมัติถ้าเลือกมอเตอร์ไซค์) -->
        <div class="mb-4" id="sizeContainer">
            <label class="block text-gray-700 text-sm font-bold mb-2">ขนาดพัสดุ</label>
            <select id="packageSize" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500">
                <option value="S">พัสดุขนาดเล็ก (SIZE S)</option>
                <option value="L">พัสดุขนาดทั่วไป (SIZE L)</option>
            </select>
        </div>

        <!-- ส่วนที่ 3: กรอกจำนวนพัสดุ -->
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">จำนวนพัสดุที่ส่งสำเร็จ (ต่อวัน)</label>
            <input type="number" id="parcels" min="0" placeholder="ระบุจำนวนชิ้น เช่น 120" class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <!-- ปุ่มคำนวณ -->
        <button onclick="calculateCommission()" class="w-full bg-orange-500 text-white font-bold p-3 rounded-xl hover:bg-orange-600 transition shadow-md">
            คำนวณและแสดงวิธีคิด
        </button>

        <!-- ส่วนที่ 4: แสดงกล่องผลลัพธ์การคำนวณ -->
        <div class="mt-6 hidden" id="resultContainer">
            <div class="p-4 bg-orange-50 rounded-xl border border-orange-200 text-center mb-4">
                <p class="text-gray-600 text-sm font-medium">💰 รวมเงินที่จะได้รับทั้งหมด</p>
                <p class="text-3xl font-extrabold text-orange-600 mt-1"><span id="totalEarnings">0</span> บาท</p>
            </div>
            
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                <h3 class="font-bold text-gray-700 text-sm mb-3">📄 รายละเอียดและวิธีคิดเงิน</h3>
                <div id="breakdownList" class="space-y-4 text-sm text-gray-600">
                    <!-- วิธีคิดแจกแจงสะสมจะมาโผล่ตรงนี้ -->
                </div>
            </div>
        </div>
    </div>

    <!-- ส่วนที่ 5: ระบบตรรกะการคำนวณขั้นบันได (JavaScript) -->
    <script>
        function toggleSizeSelect() {
            const empType = document.getElementById('empType').value;
            const sizeContainer = document.getElementById('sizeContainer');
            if (empType === 'z9_motorcycle') {
                sizeContainer.classList.add('hidden');
            } else {
                sizeContainer.classList.remove('hidden');
            }
        }

        function calculateCommission() {
            const empType = document.getElementById('empType').value;
            const size = document.getElementById('packageSize').value;
            const parcels = parseInt(document.getElementById('parcels').value) || 0;
            
            let tiers = [];

            // อ้างอิงช่วงเรทราคาขั้นบันได [เริ่มชิ้นที่, สิ้นสุดชิ้นที่, ราคาต่อชิ้น] ตามภาพตารางต้นฉบับ 100%
            if (empType === 'z9_pickup') {
                if (size === 'L') {
                    tiers = [
                        { start: 0, end: 44, rate: 0 },
                        { start: 44, end: 99, rate: 12 },
                        { start: 99, end: 169, rate: 13 },
                        { start: 169, end: 209, rate: 10.5 },
                        { start: 209, end: Infinity, rate: 9.5 }
                    ];
                } else {
                    tiers = [
                        { start: 0, end: 44, rate: 0 },
                        { start: 44, end: 99, rate: 7 },
                        { start: 99, end: 169, rate: 8 },
                        { start: 169, end: 209, rate: 6.5 },
                        { start: 209, end: Infinity, rate: 5.5 }
                    ];
                }
            } else if (empType === 'z9_own_fleet') {
                if (size === 'L') {
                    tiers = [
                        { start: 0, end: 44, rate: 0 },
                        { start: 44, end: 69, rate: 7 },
                        { start: 69, end: 114, rate: 8 },
                        { start: 114, end: Infinity, rate: 9 }
                    ];
                } else {
                    tiers = [
                        { start: 0, end: 44, rate: 0 },
                        { start: 44, end: 69, rate: 4 },
                        { start: 69, end: 114, rate: 5 },
                        { start: 114, end: Infinity, rate: 5 }
                    ];
                }
            } else if (empType === 'z9_motorcycle') {
                tiers = [
                    { start: 0, end: 69, rate: 0 },
                    { start: 69, end: 89, rate: 6 },
                    { start: 89, end: 179, rate: 7 },
                    { start: 179, end: 209, rate: 8 },
                    { start: 209, end: 249, rate: 6.5 },
                    { start: 249, end: Infinity, rate: 5.5 }
                ];
            } else if (empType === 'z6_shipper') {
                if (size === 'L') {
                    tiers = [
                        { start: 0, end: 34, rate: 0 },
                        { start: 34, end: 74, rate: 10 },
                        { start: 74, end: 114, rate: 12 },
                        { start: 114, end: Infinity, rate: 13 }
                    ];
                } else {
                    tiers = [
                        { start: 0, end: 34, rate: 0 },
                        { start: 34, end: 74, rate: 6 },
                        { start: 74, end: 114, rate: 7 },
                        { start: 114, end: Infinity, rate: 8 }
                    ];
                }
            }

            let total = 0;
            let piecesHtml = '<p class="font-semibold text-gray-700">1. แยกพัสดุออกเป็นแต่ละขั้น (ตามลำดับ)</p><ul class="list-disc pl-5 space-y-1 text-gray-600 mt-1">';
            let moneyHtml = '<p class="font-semibold text-gray-700 mt-3">2. คำนวณเงินของแต่ละขั้นแล้วนำมารวมกัน</p><ul class="list-disc pl-5 space-y-1 text-gray-600 mt-1">';

            for (let i = 0; i < tiers.length; i++) {
                let tier = tiers[i];
                if (parcels > tier.start) {
                    let currentTierParcels = Math.min(parcels, tier.end) - tier.start;
                    let tierSum = currentTierParcels * tier.rate;
                    total += tierSum;

                    let rangeLabel = tier.end === Infinity 
                        ? `ชิ้นที่ ${tier.start + 1} เป็นต้นไป` 
                        : `ชิ้นที่ ${tier.start === 0 ? 0 : tier.start + 1} - ${tier.end}`;

                    piecesHtml += `<li>ขั้นที่ ${i + 1} (${rangeLabel}): มีโควตาช่วงนี้ <span class="text-orange-600 font-bold">${currentTierParcels} ชิ้น</span> (ได้ชิ้นละ ${tier.rate} บาท)</li>`;
                    moneyHtml += `<li>ขั้นที่ ${i + 1}: ${currentTierParcels} ชิ้น × ${tier.rate} บาท = ${tierSum.toLocaleString('th-TH')} บาท</li>`;
                } else {
                    break;
                }
            }

            piecesHtml += `</ul><p class="text-xs text-gray-400 mt-1">(รวมจำนวนพัสดุทุกขั้น: ${parcels} ชิ้น ครบพอดี)</p>`;
            moneyHtml += `</ul><p class="font-bold text-gray-700 mt-3 text-right border-t pt-2">💰 รวมเงินทั้งหมด: <span class="text-orange-600 text-lg">${total.toLocaleString('th-TH')}</span> บาท</p>`;

            document.getElementById('totalEarnings').innerText = total.toLocaleString('th-TH');
            document.getElementById('breakdownList').innerHTML = piecesHtml + moneyHtml;
            document.getElementById('resultContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
